<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ジブンゼミ｜ホーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F4F5;
    --accent: #F8D423;
    --accent-press: #E8C40F;
    --navy: #1A3A6B;
    --navy-soft: #244a82;
    --ink: #1F1F1F;
    --white: #FFFFFF;
    --muted: #6B6B70;
    --line: #E4E4E7;
    --field: #FAFAFA;
    --radius: 12px;
    --shadow: 0 4px 16px rgba(0,0,0,0.12);
    --ok: #1F8A5B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #root { min-height: 100%; }
  a { color: inherit; }

  /* ── Nav ── */
  .nav {
    height: 60px; background: var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; position: sticky; top: 0; z-index: 30;
  }
  .nav .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 7px; background: var(--accent);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .brand-mark span { font-weight: 900; font-size: 16px; color: var(--navy); line-height: 1; }
  .nav .brand-name { color: var(--white); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; }

  .nav-right { display: flex; align-items: center; gap: 6px; }
  .nav-link {
    color: rgba(255,255,255,0.82); font-size: 13px; font-weight: 700;
    text-decoration: none; padding: 8px 13px; border-radius: 8px;
    display: flex; align-items: center; gap: 7px;
    transition: color 0.15s, background 0.15s;
  }
  .nav-link:hover { color: var(--white); background: rgba(255,255,255,0.10); }
  .nav-link.logout { color: rgba(255,255,255,0.7); }
  .nav-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--navy);
    display: grid; place-items: center; font-weight: 900; font-size: 13px;
    margin-left: 4px;
  }
  .nav-toggle {
    display: none; background: none; border: none; color: var(--white);
    cursor: pointer; padding: 6px; border-radius: 8px;
  }
  .nav-toggle:hover { background: rgba(255,255,255,0.1); }

  /* ── Container ── */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }

  .welcome { margin-bottom: 22px; }
  .welcome h1 { font-size: 26px; font-weight: 900; letter-spacing: 0.02em; }
  .welcome h1 .accent { position: relative; }
  .welcome h1 .accent::after {
    content: ""; position: absolute; left: -2px; right: -2px; bottom: 2px; height: 9px;
    background: var(--accent); z-index: -1; border-radius: 2px;
  }
  .welcome p { font-size: 13.5px; color: var(--muted); margin-top: 6px; }

  /* ── Progress summary ── */
  .summary {
    background: var(--navy); color: var(--white);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px 26px; margin-bottom: 30px;
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  }
  .summary .s-label { font-size: 12.5px; color: rgba(255,255,255,0.7); font-weight: 700; margin-bottom: 10px; letter-spacing: 0.04em; }
  .summary .s-top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .summary .s-pct { font-size: 38px; font-weight: 900; line-height: 1; letter-spacing: 0.02em; }
  .summary .s-pct .unit { font-size: 18px; margin-left: 2px; }
  .summary .s-count { font-size: 13px; color: rgba(255,255,255,0.78); }
  .summary .s-count b { color: var(--accent); font-weight: 900; font-size: 15px; }
  .bar { height: 10px; background: rgba(255,255,255,0.16); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: var(--accent); border-radius: 99px;
    width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .summary .s-stats { display: flex; gap: 26px; }
  .stat { text-align: center; }
  .stat .n { font-size: 26px; font-weight: 900; line-height: 1; }
  .stat .n.gold { color: var(--accent); }
  .stat .t { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 700; margin-top: 7px; }

  /* ── Section ── */
  .section { margin-bottom: 34px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sec-head h2 {
    font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 9px;
  }
  .sec-head h2 .tick {
    width: 5px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block;
  }
  .sec-more {
    font-size: 12.5px; font-weight: 700; color: var(--navy); text-decoration: none;
    display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px;
    transition: background 0.15s;
  }
  .sec-more:hover { background: rgba(26,58,107,0.07); }

  /* ── Continue card ── */
  .continue {
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    display: grid; grid-template-columns: 200px 1fr; overflow: hidden; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.18s; border: 1.5px solid transparent;
  }
  .continue:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.14); border-color: var(--accent); }
  .continue:active { transform: translateY(1px); }
  .thumb {
    background: var(--field); position: relative; overflow: hidden;
    display: grid; place-items: center; min-height: 150px;
  }
  .thumb .ph-stripes { position: absolute; inset: 0; opacity: 0.5; }
  .thumb .ph-label {
    position: relative; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; color: var(--muted); background: rgba(255,255,255,0.85);
    padding: 4px 8px; border-radius: 5px; letter-spacing: 0.02em;
  }
  .continue .c-body { padding: 22px 24px; display: flex; flex-direction: column; justify-content: center; }
  .continue .c-tagrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .resume-tag {
    font-size: 10.5px; font-weight: 900; color: var(--ink); background: var(--accent);
    padding: 3px 9px; border-radius: 99px; letter-spacing: 0.03em;
  }
  .continue h3 { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
  .continue .c-meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .continue .c-progress { display: flex; align-items: center; gap: 12px; }
  .mini-bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; max-width: 260px; }
  .mini-bar > div { height: 100%; background: var(--navy); border-radius: 99px; }
  .continue .c-pct { font-size: 12px; font-weight: 900; color: var(--navy); }

  /* ── Card grid ── */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card-art {
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: transform 0.12s, box-shadow 0.18s; border: 1.5px solid transparent;
  }
  .card-art:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,0.14); border-color: rgba(248,212,35,0.6); }
  .card-art .thumb { min-height: 130px; }
  .read-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 10.5px; font-weight: 900; padding: 4px 9px; border-radius: 99px;
    display: flex; align-items: center; gap: 4px; z-index: 2;
  }
  .read-badge.done { background: var(--ok); color: var(--white); }
  .read-badge.unread { background: var(--white); color: var(--muted); border: 1px solid var(--line); }
  .card-body { padding: 15px 16px 17px; display: flex; flex-direction: column; flex: 1; }
  .cat-tag {
    align-self: flex-start; font-size: 10.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 6px; margin-bottom: 10px; letter-spacing: 0.02em;
  }
  .card-body h3 { font-size: 14.5px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; text-wrap: pretty; flex: 1; }
  .card-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .card-foot .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }

  /* ── Recommend ── */
  .rec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .rec-card {
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 22px; cursor: pointer; display: flex; gap: 16px; align-items: flex-start;
    transition: transform 0.12s, box-shadow 0.18s; border: 1.5px solid transparent;
  }
  .rec-card:hover { box-shadow: 0 8px 22px rgba(0,0,0,0.13); border-color: rgba(248,212,35,0.6); }
  .rec-card:active { transform: translateY(1px); }
  .rec-icon {
    width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0;
    display: grid; place-items: center; background: rgba(248,212,35,0.2); color: #9a7d00;
  }
  .rec-body { flex: 1; }
  .rec-card .cat-tag { margin-bottom: 8px; }
  .rec-body h3 { font-size: 14.5px; font-weight: 700; line-height: 1.5; margin-bottom: 6px; }
  .rec-body p { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .rec-cta {
    margin-top: 12px; font-size: 12px; font-weight: 900; color: var(--navy);
    display: inline-flex; align-items: center; gap: 5px;
  }

  .foot { margin-top: 14px; font-size: 11px; color: #A0A0A6; text-align: center; letter-spacing: 0.02em; }

  /* ── Category color variants ── */
  .cat-self  { background: rgba(248,212,35,0.22); color: #8a7000; }
  .cat-es    { background: rgba(26,58,107,0.10); color: var(--navy); }
  .cat-mensetsu { background: rgba(31,138,91,0.12); color: var(--ok); }
  .cat-gyokai{ background: rgba(176,84,43,0.12); color: #9c4a25; }
  .cat-career{ background: rgba(107,70,193,0.12); color: #5a37b0; }

  @media (max-width: 880px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .summary { grid-template-columns: 1fr; gap: 20px; }
    .summary .s-stats { justify-content: flex-start; }
  }
  @media (max-width: 620px) {
    .nav { padding: 0 16px; }
    .nav-right .nav-link span.txt { display: none; }
    .nav-link { padding: 8px; }
    .wrap { padding: 22px 16px 52px; }
    .welcome h1 { font-size: 22px; }
    .continue { grid-template-columns: 1fr; }
    .continue .thumb { min-height: 120px; }
    .grid { grid-template-columns: 1fr; }
    .rec-grid { grid-template-columns: 1fr; }
    .summary { padding: 20px; }
    .summary .s-pct { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Stripes({ seed = 0 }) {
  const id = "s" + seed;
  return (
    <svg className="ph-stripes" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id={id} width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#FAFAFA"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="#E4E4E7" strokeWidth="7"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill={"url(#" + id + ")"}/>
    </svg>
  );
}

function Thumb({ label, seed }) {
  return (
    <div className="thumb">
      <Stripes seed={seed} />
      <span className="ph-label">{label}</span>
    </div>
  );
}

function CheckSmall({ color }) {
  return <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
}
function Arrow() {
  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>;
}

const CAT = {
  self:   { label: "自己分析", cls: "cat-self" },
  es:     { label: "ES対策",  cls: "cat-es" },
  mensetsu:{ label: "面接",    cls: "cat-mensetsu" },
  gyokai: { label: "業界研究", cls: "cat-gyokai" },
  career: { label: "キャリア", cls: "cat-career" },
};

const LATEST = [
  { id: 1, cat: "self", title: "「やりたいこと」が見つからない人のための自己分析フレーム", date: "6月5日", min: 8, read: false },
  { id: 2, cat: "es",   title: "通過するガクチカの作り方｜結論ファーストの型", date: "6月3日", min: 6, read: true },
  { id: 3, cat: "mensetsu", title: "逆質問で差をつける｜面接官が評価する5つの質問", date: "6月1日", min: 5, read: false },
];

const RECO = [
  { id: 4, cat: "career", title: "20代でやっておくべきキャリアの棚卸し", desc: "今の選択が10年後を決める。自分の価値観を言語化するワーク付き。" },
  { id: 5, cat: "gyokai", title: "業界研究のはじめ方｜情報の集め方マップ", desc: "何から調べればいい？ 効率的なリサーチの順番を解説します。" },
];

function App() {
  const [pct, setPct] = useState(0);
  const total = 24, doneCount = 14;
  const target = Math.round(doneCount / total * 100);

  useEffect(() => {
    const t = setTimeout(() => setPct(target), 200);
    return () => clearTimeout(t);
  }, [target]);

  return (
    <React.Fragment>
      <nav className="nav">
        <div className="brand">
          <div className="brand-mark"><span>ジ</span></div>
          <div className="brand-name">ジブンゼミ</div>
        </div>
        <div className="nav-right">
          <a className="nav-link" href="#" onClick={e=>e.preventDefault()}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span className="txt">ホーム</span>
          </a>
          <a className="nav-link" href="#" onClick={e=>e.preventDefault()}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span className="txt">マイページ</span>
          </a>
          <a className="nav-link logout" href="#" onClick={e=>e.preventDefault()}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span className="txt">ログアウト</span>
          </a>
          <div className="nav-avatar">後</div>
        </div>
      </nav>

      <div className="wrap">
        <div className="welcome">
          <h1>おかえり、<span className="accent">後藤</span>さん 👋</h1>
          <p>今日も自分と向き合う時間をつくりましょう。続きから再開できます。</p>
        </div>

        {/* Progress summary */}
        <div className="summary">
          <div>
            <div className="s-label">全体の読了率</div>
            <div className="s-top">
              <div className="s-pct">{pct}<span className="unit">%</span></div>
              <div className="s-count">全 <b>{total}</b> 記事中 <b>{doneCount}</b> 記事を読了</div>
            </div>
            <div className="bar"><div className="bar-fill" style={{ width: pct + "%" }}></div></div>
          </div>
          <div className="s-stats">
            <div className="stat"><div className="n gold">{doneCount}</div><div className="t">読了</div></div>
            <div className="stat"><div className="n">{total - doneCount}</div><div className="t">未読</div></div>
            <div className="stat"><div className="n">7</div><div className="t">連続日数</div></div>
          </div>
        </div>

        {/* Continue */}
        <div className="section">
          <div className="sec-head">
            <h2><span className="tick"></span>続きを読む</h2>
          </div>
          <div className="continue">
            <Thumb label="記事サムネイル" seed={1} />
            <div className="c-body">
              <div className="c-tagrow">
                <span className="resume-tag">前回の続き</span>
                <span className={"cat-tag " + CAT.self.cls}>{CAT.self.label}</span>
              </div>
              <h3>強みは「経験」ではなく「再現性」で語る｜自己PRの設計図</h3>
              <div className="c-meta">最終アクセス：昨日　・　残り 約4分</div>
              <div className="c-progress">
                <div className="mini-bar"><div style={{ width: "62%" }}></div></div>
                <span className="c-pct">62%</span>
              </div>
            </div>
          </div>
        </div>

        {/* Latest */}
        <div className="section">
          <div className="sec-head">
            <h2><span className="tick"></span>最新の記事</h2>
            <a className="sec-more" href="#" onClick={e=>e.preventDefault()}>すべて見る <Arrow /></a>
          </div>
          <div className="grid">
            {LATEST.map((a, i) => (
              <div className="card-art" key={a.id}>
                <div style={{ position: "relative" }}>
                  <span className={"read-badge " + (a.read ? "done" : "unread")}>
                    {a.read ? <React.Fragment><CheckSmall color="#fff" />読了</React.Fragment> : "未読"}
                  </span>
                  <Thumb label="記事サムネイル" seed={i + 2} />
                </div>
                <div className="card-body">
                  <span className={"cat-tag " + CAT[a.cat].cls}>{CAT[a.cat].label}</span>
                  <h3>{a.title}</h3>
                  <div className="card-foot">
                    <span>{a.date}</span><span className="dot"></span><span>約{a.min}分で読める</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Recommended */}
        <div className="section">
          <div className="sec-head">
            <h2><span className="tick"></span>あなたへのおすすめ</h2>
            <a className="sec-more" href="#" onClick={e=>e.preventDefault()}>もっと見る <Arrow /></a>
          </div>
          <div className="rec-grid">
            {RECO.map(r => (
              <div className="rec-card" key={r.id}>
                <div className="rec-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </div>
                <div className="rec-body">
                  <span className={"cat-tag " + CAT[r.cat].cls}>{CAT[r.cat].label}</span>
                  <h3>{r.title}</h3>
                  <p>{r.desc}</p>
                  <span className="rec-cta">この記事を読む <Arrow /></span>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="foot">© 2026 ジブンゼミ　月額500円のキャリア支援サブスク</div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
