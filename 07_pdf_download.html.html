<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ジブンゼミ｜PDFワークシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F4F5;
    --accent: #F8D423;
    --accent-press: #E8C40F;
    --navy: #1A3A6B;
    --ink: #1F1F1F;
    --white: #FFFFFF;
    --muted: #6B6B70;
    --line: #E4E4E7;
    --field: #FAFAFA;
    --radius: 12px;
    --shadow: 0 4px 16px rgba(0,0,0,0.12);
    --ok: #1F8A5B;
    --pdf: #C0392B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { min-height: 100%; }
  a { color: inherit; }

  /* ── Nav ── */
  .nav { height: 60px; background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 30; }
  .nav .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .brand-mark span { font-weight: 900; font-size: 16px; color: var(--navy); line-height: 1; }
  .nav .brand-name { color: var(--white); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; }
  .nav-right { display: flex; align-items: center; gap: 6px; }
  .nav-link { color: rgba(255,255,255,0.82); font-size: 13px; font-weight: 700; text-decoration: none; padding: 8px 13px; border-radius: 8px; display: flex; align-items: center; gap: 7px; transition: color 0.15s, background 0.15s; }
  .nav-link:hover { color: var(--white); background: rgba(255,255,255,0.10); }
  .nav-link.active { color: var(--white); background: rgba(255,255,255,0.13); }
  .nav-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--navy); display: grid; place-items: center; font-weight: 900; font-size: 13px; margin-left: 4px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 8px; flex-wrap: wrap; }
  .page-head h1 { font-size: 26px; font-weight: 900; letter-spacing: 0.02em; display: flex; align-items: center; gap: 12px; }
  .page-head h1 .hic { width: 38px; height: 38px; border-radius: 10px; background: rgba(192,57,43,0.10); color: var(--pdf); display: grid; place-items: center; }
  .page-head p { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .gdrive-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; background: var(--white); border: 1.5px solid var(--line); padding: 8px 14px; border-radius: 99px; white-space: nowrap; }
  .gdrive-note .gd { width: 16px; height: 16px; }

  .subhead { font-size: 13px; color: var(--muted); margin: 18px 0 16px; }
  .subhead b { color: var(--ink); font-weight: 700; }

  /* ── Filter ── */
  .filters { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; scrollbar-width: thin; }
  .filters::-webkit-scrollbar { height: 6px; }
  .filters::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .filter-btn { flex-shrink: 0; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--white); border: 1.5px solid var(--line); border-radius: 99px; padding: 9px 18px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 7px; transition: all 0.16s; }
  .filter-btn:hover { border-color: var(--muted); color: var(--ink); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--ink); box-shadow: 0 2px 8px rgba(248,212,35,0.4); }
  .filter-btn .fc { font-size: 11px; font-weight: 900; background: var(--bg); color: var(--muted); padding: 1px 7px; border-radius: 99px; min-width: 20px; text-align: center; }
  .filter-btn.active .fc { background: rgba(0,0,0,0.12); color: var(--ink); }

  /* ── Grid ── */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .pdf-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 20px 18px; display: flex; flex-direction: column; transition: transform 0.12s, box-shadow 0.18s; border: 1.5px solid transparent; position: relative; }
  .pdf-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,0.13); border-color: rgba(248,212,35,0.5); }
  .pdf-card.got { border-color: var(--line); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .pdf-icon { width: 48px; height: 58px; border-radius: 9px; flex-shrink: 0; background: rgba(192,57,43,0.09); color: var(--pdf); border: 1.5px solid rgba(192,57,43,0.2); display: grid; place-items: center; position: relative; }
  .pdf-icon .ext { position: absolute; bottom: 6px; font-size: 8px; font-weight: 900; letter-spacing: 0.04em; }
  .got-badge { font-size: 10.5px; font-weight: 900; padding: 4px 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; background: rgba(138,138,144,0.16); color: #7a7a80; }
  .cat-mini { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 5px; margin-bottom: 9px; align-self: flex-start; }
  .cat-self { background: rgba(248,212,35,0.22); color: #8a7000; }
  .cat-shukatsu { background: rgba(26,58,107,0.10); color: var(--navy); }
  .cat-career { background: rgba(107,70,193,0.12); color: #5a37b0; }
  .cat-mind { background: rgba(31,138,91,0.12); color: var(--ok); }
  .pdf-card h3 { font-size: 15px; font-weight: 700; line-height: 1.45; margin-bottom: 8px; text-wrap: pretty; }
  .linked { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .linked .li { color: var(--navy); flex-shrink: 0; }
  .linked .lt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-desc { font-size: 12.5px; color: #4a4a50; line-height: 1.6; margin-bottom: 14px; flex: 1; }
  .pdf-meta { font-size: 11px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .pdf-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }

  .btn-dl { width: 100%; font-family: inherit; font-size: 14px; font-weight: 900; color: var(--ink); background: var(--accent); border: none; border-radius: 10px; padding: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 10px rgba(248,212,35,0.35); transition: all 0.16s; position: relative; overflow: hidden; }
  .btn-dl:hover { background: var(--accent-press); box-shadow: 0 5px 14px rgba(248,212,35,0.45); }
  .btn-dl:active { transform: translateY(1px); }
  .btn-dl.downloading { background: var(--field); color: var(--muted); box-shadow: none; cursor: default; pointer-events: none; }
  .btn-dl.got-btn { background: var(--white); color: var(--ok); border: 1.5px solid rgba(31,138,91,0.4); box-shadow: none; }
  .btn-dl.got-btn:hover { background: rgba(31,138,91,0.06); }
  .dl-progress { position: absolute; left: 0; bottom: 0; height: 3px; background: #C9A100; transition: width 0.1s linear; }
  .spinner { width: 15px; height: 15px; border: 2.5px solid rgba(31,31,31,0.2); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .e-icon { color: var(--line); margin-bottom: 14px; }
  .empty h3 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }

  .foot { margin-top: 36px; font-size: 11px; color: #A0A0A6; text-align: center; letter-spacing: 0.02em; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--white); font-size: 13px; font-weight: 500; padding: 13px 22px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 50; display: flex; align-items: center; gap: 9px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .tk { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }

  @media (max-width: 880px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) {
    .nav { padding: 0 16px; }
    .nav-right .nav-link span.txt { display: none; }
    .nav-link { padding: 8px; }
    .wrap { padding: 22px 16px 52px; }
    .page-head h1 { font-size: 21px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useMemo } = React;

function Icon({ children, size = 18 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
}

const CATS = [
  { key: "all", label: "すべて" },
  { key: "self", label: "自己分析" },
  { key: "shukatsu", label: "就活対策" },
  { key: "career", label: "キャリア設計" },
  { key: "mind", label: "マインドセット" },
];
const CATMAP = { self: { label: "自己分析", cls: "cat-self" }, shukatsu: { label: "就活対策", cls: "cat-shukatsu" }, career: { label: "キャリア設計", cls: "cat-career" }, mind: { label: "マインドセット", cls: "cat-mind" } };

const PDFS = [
  { id: 1, cat: "self", name: "心が動いた瞬間ワークシート", linked: "「やりたいこと」が見つからない人のための自己分析フレーム", desc: "過去の経験から心が動いた瞬間を抽出し、3つの価値観の軸に整理するワークです。", pages: 2, size: "420KB", got: true },
  { id: 2, cat: "self", name: "自己PR設計シート（再現性ver.）", linked: "強みは「経験」ではなく「再現性」で語る｜自己PRの設計図", desc: "あなたの強みを「再現性のあるエピソード」として言語化するためのテンプレート。", pages: 1, size: "280KB", got: true },
  { id: 3, cat: "shukatsu", name: "ガクチカ構成フレーム", linked: "通過するガクチカの作り方｜結論ファーストの型", desc: "結論ファーストで伝わるガクチカを、穴埋め形式で組み立てられます。", pages: 2, size: "350KB", got: false },
  { id: 4, cat: "shukatsu", name: "逆質問リスト30選", linked: "逆質問で差をつける｜面接官が評価する5つの質問", desc: "面接官の印象に残る逆質問を、場面別に30個まとめた早見表です。", pages: 3, size: "510KB", got: false },
  { id: 5, cat: "career", name: "キャリアの棚卸しテンプレート", linked: "20代でやっておくべきキャリアの棚卸し", desc: "これまでの経験・スキル・価値観を一枚で棚卸しできるシートです。", pages: 3, size: "560KB", got: false },
  { id: 6, cat: "mind", name: "就活メンタル セルフチェック表", linked: "比べない技術｜SNS時代の就活メンタル管理", desc: "今の心の状態を可視化し、無理しすぎていないかを確認できます。", pages: 1, size: "240KB", got: false },
  { id: 7, cat: "self", name: "価値観カード（印刷用）", linked: "価値観カードで見つける、譲れない3つの軸", desc: "切り取って使える価値観カード。優先順位づけで本当の軸が見えてきます。", pages: 4, size: "680KB", got: false },
  { id: 8, cat: "career", name: "企業比較ワークシート", linked: "大企業 vs ベンチャー、判断軸を10分で整理する", desc: "気になる企業を同じ観点で並べて比較し、納得の意思決定を支援します。", pages: 2, size: "390KB", got: false },
];

function App() {
  const [cat, setCat] = useState("all");
  const [items, setItems] = useState(PDFS);
  const [dl, setDl] = useState({}); // id -> progress 0..100
  const [toast, setToast] = useState("");

  function flash(msg) { setToast(msg); clearTimeout(window._t); window._t = setTimeout(() => setToast(""), 2200); }

  const counts = useMemo(() => {
    const c = { all: items.length };
    for (const p of items) c[p.cat] = (c[p.cat] || 0) + 1;
    return c;
  }, [items]);
  const gotCount = items.filter(p => p.got).length;

  const filtered = useMemo(() => items.filter(p => cat === "all" || p.cat === cat), [items, cat]);

  function download(p) {
    if (dl[p.id] != null) return;
    setDl(d => ({ ...d, [p.id]: 0 }));
    let pct = 0;
    const iv = setInterval(() => {
      pct += Math.random() * 22 + 10;
      if (pct >= 100) {
        pct = 100;
        clearInterval(iv);
        setDl(d => ({ ...d, [p.id]: 100 }));
        setTimeout(() => {
          setItems(its => its.map(x => x.id === p.id ? { ...x, got: true } : x));
          setDl(d => { const n = { ...d }; delete n[p.id]; return n; });
          flash("「" + p.name + "」をダウンロードしました");
        }, 350);
      } else {
        setDl(d => ({ ...d, [p.id]: pct }));
      }
    }, 180);
  }

  return (
    <React.Fragment>
      <nav className="nav">
        <div className="brand">
          <div className="brand-mark"><span>ジ</span></div>
          <div className="brand-name">ジブンゼミ</div>
        </div>
        <div className="nav-right">
          <a className="nav-link" href="#" onClick={e=>e.preventDefault()}>
            <Icon size={16}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></Icon><span className="txt">ホーム</span>
          </a>
          <a className="nav-link" href="#" onClick={e=>e.preventDefault()}>
            <Icon size={16}><g><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></g></Icon><span className="txt">記事一覧</span>
          </a>
          <a className="nav-link active" href="#" onClick={e=>e.preventDefault()}>
            <Icon size={16}><g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></g></Icon><span className="txt">PDF</span>
          </a>
          <a className="nav-link" href="#" onClick={e=>e.preventDefault()}>
            <Icon size={16}><g><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></Icon><span className="txt">マイページ</span>
          </a>
          <div className="nav-avatar">後</div>
        </div>
      </nav>

      <div className="wrap">
        <div className="page-head">
          <div>
            <h1>
              <span className="hic"><Icon size={20}><g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></g></Icon></span>
              PDFワークシート一覧
            </h1>
            <p>記事と連動したワークシートをダウンロードして、手を動かしながら学べます。</p>
          </div>
          <div className="gdrive-note">
            <Icon size={15}><g><path d="M12 2v6m0 0l3-3m-3 3L9 5"/><path d="M3 14h18M5 18h14"/><circle cx="12" cy="14" r="0.01"/></g></Icon>
            会員限定・Googleドライブ管理
          </div>
        </div>

        <div className="subhead">全 <b>{items.length}</b> 件　うち取得済み <b>{gotCount}</b> 件</div>

        <div className="filters">
          {CATS.map(c => (
            <button key={c.key} className={"filter-btn" + (cat === c.key ? " active" : "")} onClick={() => setCat(c.key)}>
              {c.label}<span className="fc">{counts[c.key] || 0}</span>
            </button>
          ))}
        </div>

        <div className="grid">
          {filtered.length === 0 ? (
            <div className="empty">
              <div className="e-icon"><Icon size={50}><g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></g></Icon></div>
              <h3>このカテゴリのワークシートはありません</h3>
            </div>
          ) : filtered.map(p => {
            const progress = dl[p.id];
            const isDl = progress != null;
            return (
              <div className={"pdf-card" + (p.got ? " got" : "")} key={p.id}>
                <div className="card-top">
                  <div className="pdf-icon">
                    <Icon size={22}><g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></g></Icon>
                    <span className="ext">PDF</span>
                  </div>
                  {p.got && <span className="got-badge"><Icon size={11}><polyline points="20 6 9 17 4 12"/></Icon>取得済み</span>}
                </div>
                <span className={"cat-mini " + CATMAP[p.cat].cls}>{CATMAP[p.cat].label}</span>
                <h3>{p.name}</h3>
                <div className="linked">
                  <span className="li"><Icon size={13}><g><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></g></Icon></span>
                  <span className="lt">{p.linked}</span>
                </div>
                <div className="pdf-desc">{p.desc}</div>
                <div className="pdf-meta"><span>PDF</span><span className="dot"></span><span>A4 {p.pages}ページ</span><span className="dot"></span><span>{p.size}</span></div>
                <button
                  className={"btn-dl" + (isDl ? " downloading" : "") + (p.got && !isDl ? " got-btn" : "")}
                  onClick={() => download(p)}
                >
                  {isDl ? (
                    <React.Fragment>
                      <span className="spinner"></span>ダウンロード中… {Math.round(progress)}%
                      <span className="dl-progress" style={{ width: progress + "%" }}></span>
                    </React.Fragment>
                  ) : p.got ? (
                    <React.Fragment>
                      <Icon size={15}><polyline points="20 6 9 17 4 12"/></Icon>再ダウンロード
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <Icon size={15}><g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></g></Icon>ダウンロード
                    </React.Fragment>
                  )}
                </button>
              </div>
            );
          })}
        </div>

        <div className="foot">© 2026 ジブンゼミ　月額500円のキャリア支援サブスク</div>
      </div>

      <div className={"toast" + (toast ? " show" : "")}>
        <span className="tk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A3A6B" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        {toast}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
